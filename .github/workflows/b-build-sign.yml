name: B · Build, sign and push

# Pista B: construye una imagen mínima, la sube a GHCR y la firma con cosign en modo keyless.
# No hay llaves ni secretos propios: la identidad de la firma es este workflow (certificado de corta duración de Fulcio).
on:
  workflow_dispatch:
    inputs:
      sign:
        description: "¿Firmar la imagen? Usa false en el ejercicio B2 para generar una imagen sin firma."
        type: boolean
        default: true

permissions:
  contents: read
  packages: write   # subir la imagen a ghcr.io
  id-token: write   # pedir el token OIDC con el que Fulcio emite el certificado de firma

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Nombre de la imagen (en minúsculas)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/demo" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Construir y subir
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: track-b-supply-chain/app
          push: true
          tags: ${{ steps.img.outputs.name }}:${{ inputs.sign && 'signed' || 'unsigned' }}

      - name: Instalar cosign
        if: ${{ inputs.sign }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Firmar (keyless) por digest
        if: ${{ inputs.sign }}
        run: cosign sign --yes "${{ steps.img.outputs.name }}@${{ steps.push.outputs.digest }}"

      - name: Resumen
        run: |
          {
            echo "### Imagen publicada"
            echo
            echo "- Imagen: \`${{ steps.img.outputs.name }}:${{ inputs.sign && 'signed' || 'unsigned' }}\`"
            echo "- Digest: \`${{ steps.push.outputs.digest }}\`"
            echo "- Firmada: \`${{ inputs.sign }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
